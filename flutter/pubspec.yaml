name: red_rebels_calendar
description: "Red Rebels — Nea Salamina match calendar and stats for Android & iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  share_plus: ^13.2.0
  package_info_plus: ^10.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  add_2_calendar: ^3.1.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Already pinned by flutter_test; declared so tests may import it directly.
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/i18n/
    - assets/images/
    - assets/images/bg/
    - assets/images/players/
    - assets/images/team_logos/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    # Visual-theme fonts (variable TTFs from google/fonts, OFL alongside;
    # weights are pinned via TextStyle.fontVariations in theme.dart).
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/orbitron/Orbitron.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#C82E04"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  remove_alpha_ios: true
