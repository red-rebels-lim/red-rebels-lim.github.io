name: Send Match Reminders

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_fcm_token:
        description: 'FCM device token to send a test push to'
        required: true
        type: string
      test_event_key:
        description: 'Optional eventKey for the deep-link data payload'
        required: false
        type: string

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Send reminders
        if: github.event_name != 'workflow_dispatch'
        run: node send-reminders.js
        working-directory: .github/scripts
        env:
          TZ: Europe/Nicosia
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BACK4APP_APP_ID: ${{ secrets.BACK4APP_APP_ID }}
          BACK4APP_MASTER_KEY: ${{ secrets.BACK4APP_MASTER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Send test push
        if: github.event_name == 'workflow_dispatch'
        run: node send-test-push.js
        working-directory: .github/scripts
        env:
          TZ: Europe/Nicosia
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_FCM_TOKEN: ${{ inputs.test_fcm_token }}
          TEST_EVENT_KEY: ${{ inputs.test_event_key }}
